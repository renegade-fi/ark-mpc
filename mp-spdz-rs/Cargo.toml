[package]
name = "mp-spdz-rs"
version = "0.1.0"
edition = "2021"

[features]
parallel = ["ark-ec/parallel", "ark-ff/parallel", "dep:rayon"]
test-helpers = ["dep:rand"]

[[bench]]
name = "plaintext_ops"
harness = false
required-features = ["test-helpers"]

[[bench]]
name = "plaintext_vec_ops"
harness = false
required-features = ["test-helpers"]

[[bench]]
name = "ciphertext_ops"
harness = false
required-features = ["test-helpers"]

[dependencies]
# === Arithmetic + Crypto === #
ark-bn254 = "0.6"
ark-ec = { version = "0.6" }
ark-ff = { version = "0.6" }
ark-mpc = { path = "../online-phase" }

# === Bindings === #
cxx = "1.0"

# === Misc === #
rand = { version = "0.10.1", optional = true }
rayon = { version = "1.12", optional = true }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
cxx-build = "1.0"
itertools = "0.14.0"
pkg-config = "0.3"

[dev-dependencies]
ark-bn254 = "0.6"
criterion = { version = "0.8", features = ["async", "async_tokio"] }
rand = "0.10.1"
serde_json = "1.0"
