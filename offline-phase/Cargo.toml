[package]
name = "ark-mpc-offline"
version = "0.1.0"
edition = "2021"

[features]
parallel = [
    "ark-ec/parallel",
    "ark-ff/parallel",
    "ark-std/parallel",
    "mp-spdz-rs/parallel",
    "dep:rayon",
]

[dependencies]
# === Crypto + Arithmetic === #
ark-ec = "0.6"
ark-ff = "0.6"
ark-std = "0.6"
ark-mpc = { path = "../online-phase" }

mp-spdz-rs = { path = "../mp-spdz-rs" }

# === Runtime + Network === #
futures = "0.3"

# === Misc Dependencies === #
itertools = "0.14"
rand = "0.10"
rayon = { version = "1.12", optional = true }
sha3 = { version = "0.12" }

[dev-dependencies]
ark-bn254 = "0.6"
ark-mpc = { path = "../online-phase", features = ["test_helpers"] }
tokio = { version = "1", features = ["full"] }
